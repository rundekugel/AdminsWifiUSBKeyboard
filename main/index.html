<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>ESP Macro</title>
<style>
body{font-family:Arial;margin:20px}
textarea,input[type=text],input[type=password],input:not([type]){width:100%;margin:4px 0;box-sizing:border-box}
#modifiers label{display:inline-block;margin:4px 8px 4px 0}
#modifiers input{width:auto;margin:0 4px 0 0}
button{margin:4px;padding:8px}
.card{border:1px solid #ccc;padding:10px;margin:8px 0}
#statusBar{display:flex;gap:20px;padding:6px 10px;background:#f0f0f0;border-radius:4px;margin-bottom:8px;font-size:0.9em}
.st-dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:#ccc;margin-right:5px;vertical-align:middle}
.st-dot.on{background:#2a2}
.st-dot.off{background:#c44}
#lockStatus{margin:6px 0}
#lockStatus span{display:inline-block;padding:2px 8px;margin:2px 2px 2px 0;border:1px solid #999;border-radius:3px;font-size:0.8em;font-weight:bold;opacity:0.3;background:#eee}
#lockStatus span.on{opacity:1;background:#2a2;color:#fff;border-color:#2a2}
</style>
</head>
<body>
<h2>ESP Macro Console V0.0.2</h2>
<p><a href="/wifi">&#9881; WiFi Settings</a></p>
<div id="statusBar">
  <span><span class="st-dot" id="dot_hid"></span><strong>USB HID:</strong> <span id="st_hid">…</span></span>
  <span><span class="st-dot" id="dot_wifi"></span><strong>WiFi Clients:</strong> <span id="st_clients">…</span></span>
  <span><span class="st-dot" id="dot_sta"></span><strong>WiFi STA:</strong> <span id="st_sta">…</span></span>
</div>

<div class="card">
<h3>Send</h3>
<div id="modifiers">
  <label><input type="checkbox" id="mod_lctrl"> LCtrl</label>
  <label><input type="checkbox" id="mod_rctrl"> RCtrl</label>
  <label><input type="checkbox" id="mod_lshift"> LShift</label>
  <label><input type="checkbox" id="mod_rshift"> RShift</label>
  <label><input type="checkbox" id="mod_lalt"> LAlt</label>
  <label><input type="checkbox" id="mod_ralt"> RAlt</label>
  <label><input type="checkbox" id="mod_super"> Super</label>
</div>
<textarea id="txt" rows="4" placeholder="Type here — keys sent immediately when checked, or uncheck and click Send Text"></textarea>
<div id="lockStatus">
  <span id="lk_num">NUM</span>
  <span id="lk_caps">CAPS</span>
  <span id="lk_scrl">SCRL</span>
</div>
<label><input type="checkbox" id="send_immediately" checked> Send keys immediately</label>
<br>
<button onclick="sendText()">Send as Text</button>
<button onclick="document.getElementById('txt').value=''">Clear</button>
<hr>
<div><strong>Media:</strong>
 <button onclick="sendMedia('PLAY_PAUSE')">&#9654;&#9646;&#9646;</button>
 <button onclick="sendMedia('PREV')">&#9664;&#9664;</button>
 <button onclick="sendMedia('NEXT')">&#9654;&#9654;</button>
 <button onclick="sendMedia('MUTE')">&#128263;</button>
 <button onclick="sendMedia('VOL_DOWN')">&#128266;&#8211;</button>
 <button onclick="sendMedia('VOL_UP')">&#128266;+</button>
</div>
<hr>
<div><strong>Log:</strong> <button onclick="comboLog.value=''">Clear</button></div>
<textarea id="comboLog" rows="5" readonly style="background:#f5f5f5;font-family:monospace;font-size:0.85em"></textarea>
</div>

<div class="card">
<h3>USB Device Config</h3>
<label>VID (hex)<input id="usb_vid" type="text" placeholder="e.g. 303A"></label>
<label>PID (hex)<input id="usb_pid" type="text" placeholder="e.g. 4004"></label>
<label>Manufacturer<input id="usb_mfr" type="text" placeholder="Manufacturer"></label>
<label>Product<input id="usb_product" type="text" placeholder="Product name"></label>
<label>Serial<input id="usb_serial" type="text" placeholder="Serial number"></label>
<br>
<button onclick="saveUsbCfg()">Save &amp; Restart</button>
<span id="usb_msg" style="font-size:0.85em;margin-left:8px"></span>
</div>

<div class="card">
<h3>Save Macro</h3>
<input id="name" placeholder="Macro Name">
<textarea id="body" rows="8">STRING hello
KEY ENTER</textarea>
<button onclick="saveMacro()">Save</button>
</div>

<div class="card">
<h3>Macros</h3>
<div id="list"></div>
</div>

<script>
const MOD_LIST=[
 ['mod_lctrl','LCTRL'],['mod_rctrl','RCTRL'],
 ['mod_lshift','LSHIFT'],['mod_rshift','RSHIFT'],
 ['mod_lalt','LALT'],['mod_ralt','RALT'],
 ['mod_super','SUPER']
];
const SKIP_KEYS=new Set(['Control','Shift','Alt','Meta','AltGraph','Dead','Unidentified','Process']);

function normalizeKey(k){
 if(k===' ') return 'SPACE';
 return k.replace(/\s/g,'').toUpperCase();
}

function buildCmdForKey(keyStr){
 const active=MOD_LIST.filter(([id])=>document.getElementById(id).checked).map(([,name])=>name);
 if(!keyStr) return null;
 const parts=[...active,keyStr].join('+');
 return active.length?'COMBO '+parts:'KEY '+keyStr;
}

function logCombo(cmd){
 const ts=new Date().toLocaleTimeString();
 comboLog.value=ts+' > '+cmd+'\n'+comboLog.value;
}

document.addEventListener('DOMContentLoaded',()=>{
 document.getElementById('txt').addEventListener('keydown',function(e){
  if(!document.getElementById('send_immediately').checked) return;
  if(SKIP_KEYS.has(e.key)) return;
  e.preventDefault();
  const keyStr=normalizeKey(e.key);
  const cmd=buildCmdForKey(keyStr);
  if(!cmd) return;
  fetch('/send',{method:'POST',body:cmd});
  logCombo(cmd);
 });
});

async function sendMedia(key){
 await fetch('/send',{method:'POST',body:'MEDIA '+key});
 logCombo('MEDIA '+key);
}

async function sendText(){
 const val=document.getElementById('txt').value;
 if(!val) return;
 await fetch('/send',{method:'POST',body:val});
 logCombo('TEXT: '+val.substring(0,40)+(val.length>40?'…':''));
}

async function pollStatus(){
 try{
  const r=await fetch('/status');
  const j=await r.json();
  document.getElementById('st_hid').textContent=j.hid?'Enumerated':'Not connected';
  document.getElementById('dot_hid').className='st-dot '+(j.hid?'on':'off');
  document.getElementById('st_clients').textContent=j.clients;
  document.getElementById('dot_wifi').className='st-dot '+(j.clients>0?'on':'off');
  document.getElementById('st_sta').textContent=j.sta?(j.ip||'connected'):'Not connected';
  document.getElementById('dot_sta').className='st-dot '+(j.sta?'on':'off');
  /* LED state from host: bit0=NumLock bit1=CapsLock bit2=ScrollLock */
  const leds=j.leds||0;
  document.getElementById('lk_num').className =(leds&0x01)?'on':'';
  document.getElementById('lk_caps').className=(leds&0x02)?'on':'';
  document.getElementById('lk_scrl').className=(leds&0x04)?'on':'';
 }catch(err){
  ['st_hid','st_clients','st_sta'].forEach(id=>document.getElementById(id).textContent='?');
 }
}
setInterval(pollStatus,2000);
pollStatus();

async function loadUsbCfg(){
 try{
  const j=await (await fetch('/usb/config')).json();
  document.getElementById('usb_vid').value=j.vid||'';
  document.getElementById('usb_pid').value=j.pid||'';
  document.getElementById('usb_mfr').value=j.mfr||'';
  document.getElementById('usb_product').value=j.product||'';
  document.getElementById('usb_serial').value=j.serial||'';
 }catch(e){}
}
async function saveUsbCfg(){
 const vid=document.getElementById('usb_vid').value.replace(/^0x/i,'').trim();
 const pid=document.getElementById('usb_pid').value.replace(/^0x/i,'').trim();
 const mfr=document.getElementById('usb_mfr').value;
 const product=document.getElementById('usb_product').value;
 const serial=document.getElementById('usb_serial').value;
 document.getElementById('usb_msg').textContent='Saving…';
 await fetch('/usb/config',{method:'POST',body:vid+'|'+pid+'|'+mfr+'|'+product+'|'+serial});
 document.getElementById('usb_msg').textContent='Saved – restarting…';
}

async function saveMacro(){
 await fetch('/macro/save',{method:'POST',body:name.value+'|'+body.value});
 load();
}
async function runMacro(id){
 await fetch('/macro/run',{method:'POST',body:''+id});
}
async function load(){
 let r=await fetch('/macro/list');
 let j=await r.json();
 list.innerHTML='';
 j.forEach(m=>{
   let d=document.createElement('div');
   d.innerHTML='<button onclick="runMacro('+m.id+')">Run</button> '+m.name;
   list.appendChild(d);
 });
}
load();
loadUsbCfg();
</script>
</body>
</html>
