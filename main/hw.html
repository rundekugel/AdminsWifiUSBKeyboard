<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Admin-Keyboard – Hardware V%%VERSION%%</title>
<style>
body{font-family:Arial;margin:20px}
input{width:100%;margin:4px 0;box-sizing:border-box;padding:6px}
button{margin:4px;padding:8px}
.card{border:1px solid #ccc;padding:10px;margin:8px 0}
.cb{display:flex;align-items:center;gap:6px;margin:4px 0}
.cb input{width:auto}
#msg{margin-top:8px;font-size:0.9em}

</style>
</head>
<body>
<p><a href="/">&#8592; Home</a> &nbsp;|&nbsp; <a href="/wifi">&#9881; WiFi Settings</a> &nbsp; <a href="/usb">&#128279; USB Device</a> &nbsp; <a href="/hw">&#9881;&#9082; Hardware</a> &nbsp; <a href="/monitor">&#128202; Monitor</a> &nbsp; <a href="/help">&#63; Help</a></p>
<h2>Hardware Settings V%%VERSION%%</h2>

<div class="card">
<h3>Status LED</h3>
<label>GPIO Pin (-1 to disable)<input id="led_pin" type="text" placeholder="-1"></label>
<label class="cb"><input id="led_neo" type="checkbox"> NeoPixel / WS2812 on that pin</label>
<label class="cb"><input id="led_inv" type="checkbox"> Invert output (active-low)</label>
</div>

<div class="card">
<h3>WPS Button</h3>
<label>GPIO Pin (-1 to disable)<input id="btn_pin" type="text" placeholder="0"></label>
<p style="font-size:0.85em;color:#666;margin:4px 0">Hold 3 s to start WPS PBC pairing. GPIO 0 = built-in BOOT button.</p>
</div>

<button onclick="save(true)">Save &amp; Restart</button>
<button onclick="save(false)">Save</button>
<span id="msg"></span>

<script>
async function load(){
 try{
  const j=await (await fetch('/hw/config')).json();
  document.getElementById('led_pin').value=j.led_pin??-1;
  document.getElementById('led_neo').checked=!!j.led_neo;
  document.getElementById('led_inv').checked=!!j.led_inv;
  document.getElementById('btn_pin').value=j.btn_pin??0;
 }catch(e){document.getElementById('msg').textContent='Load failed.';}
}
async function save(restart){
 const led_pin=document.getElementById('led_pin').value.trim()||'-1';
 const led_neo=document.getElementById('led_neo').checked?'1':'0';
 const led_inv=document.getElementById('led_inv').checked?'1':'0';
 const btn_pin=document.getElementById('btn_pin').value.trim()||'-1';
 const msg=document.getElementById('msg');
 msg.textContent='Saving\u2026';
 const url=restart?'/hw/config':'/hw/config/save';
 await fetch(url,{method:'POST',body:led_pin+'|'+led_neo+'|'+led_inv+'|'+btn_pin});
 msg.textContent=restart?'Saved \u2013 restarting\u2026':'Saved.';
}
load();
</script>
</body>
</html>
